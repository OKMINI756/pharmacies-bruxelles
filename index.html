<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow">
<title>Base de données — Pharmacies de Belgique</title>
<style>
:root{--bg:#0b0f17;--panel:#141b27;--panel2:#1b2433;--line:#27313f;--ink:#e7edf6;--mut:#8a97a8;
--blue:#4d8dff;--emer:#22c98a;--amber:#f5a524;--violet:#a78bfa;}
*{box-sizing:border-box;-webkit-user-select:none;-moz-user-select:none;user-select:none;-webkit-touch-callout:none;}
img{pointer-events:none;-webkit-user-drag:none;}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;}
.wrap{max-width:1180px;margin:0 auto;padding:22px;}
.top{display:flex;align-items:center;gap:14px;margin-bottom:6px;}
.logo{width:42px;height:42px;border-radius:10px;background:linear-gradient(135deg,#4d8dff,#22c98a);display:flex;align-items:center;justify-content:center;font-size:22px;}
h1{font-size:22px;margin:0;}.sub{color:var(--mut);font-size:13px;margin:2px 0 0;}
.stats{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin:18px 0;}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;}
.stat b{display:block;font-size:24px;font-weight:700;}
.stat span{font-size:10px;color:var(--mut);text-transform:uppercase;letter-spacing:.6px;}
.bar{display:flex;height:10px;border-radius:6px;overflow:hidden;margin:6px 0 18px;border:1px solid var(--line);}
.bar i{display:block;height:100%;}
.searchbox{position:relative;margin-bottom:14px;}
.searchbox input{width:100%;padding:15px 16px 15px 44px;font-size:16px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--ink);outline:none;}
.searchbox input:focus{border-color:var(--blue);}
.searchbox .ic{position:absolute;left:15px;top:14px;color:var(--mut);font-size:18px;}
.cnt{color:var(--mut);font-size:12px;margin:0 2px 10px;}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:13px 15px;cursor:pointer;transition:.15s;}
.card:hover{border-color:var(--blue);background:var(--panel2);}
.card .nm{font-weight:650;font-size:15px;}.card .meta{color:var(--mut);font-size:12px;margin-top:3px;}
.chips{margin-top:8px;display:flex;gap:6px;flex-wrap:wrap;}
.chip{font-size:10px;padding:2px 8px;border-radius:20px;border:1px solid var(--line);color:var(--mut);}
.chip.on{color:var(--emer);border-color:#1d6b4d;}.chip.sc{color:var(--amber);border-color:#7a5a17;}
.ov{position:fixed;inset:0;background:rgba(4,7,12,.74);display:none;align-items:center;justify-content:center;padding:20px;z-index:9;}
.ov.show{display:flex;}
.modal{width:560px;max-width:100%;background:var(--panel);border:1px solid var(--line);border-radius:16px;overflow:hidden;position:relative;}
.mhead{padding:18px 20px;background:linear-gradient(135deg,#16233a,#141b27);border-bottom:1px solid var(--line);}
.mhead h2{margin:0;font-size:18px;}.mhead .en{color:var(--mut);font-size:13px;margin-top:3px;}
.mbody{padding:14px 20px 20px;}
.row{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px;align-items:center;}
.row:last-of-type{border:none;}.row .k{color:var(--mut);}.row .v{text-align:right;font-weight:550;max-width:62%;}
.reveal{display:flex;align-items:center;gap:8px;justify-content:flex-end;min-height:26px;}
.btn{font-size:12px;padding:5px 12px;border-radius:8px;border:1px solid var(--blue);color:var(--blue);background:transparent;cursor:pointer;}
.btn:hover{background:rgba(77,141,255,.12);}
.mask{color:var(--mut);font-family:monospace;letter-spacing:2px;}
.close{position:absolute;top:16px;right:22px;color:var(--mut);font-size:26px;cursor:pointer;line-height:1;}
.note{margin-top:14px;font-size:11px;color:var(--mut);text-align:center;}
.wm{position:fixed;inset:0;pointer-events:none;z-index:1;opacity:.04;background-image:repeating-linear-gradient(-30deg,transparent 0 90px,#fff 90px 91px);}
.wmtxt{position:fixed;bottom:8px;right:12px;color:var(--mut);font-size:10px;opacity:.5;z-index:2;}
@media(max-width:780px){.stats{grid-template-columns:repeat(3,1fr);}.grid{grid-template-columns:1fr;}}
</style></head>
<body>
<div class="wm"></div><div class="wmtxt">Données confidentielles — consultation protégée</div>
<div class="wrap">
  <div class="top"><div class="logo">⚕️</div>
    <div><h1>Base de données — Pharmacies de Belgique</h1>
    <p class="sub">Registre officiel AFMPS + BCE/KBO · consultation protégée</p></div></div>
  <div class="stats" id="stats"></div>
  <div class="bar" id="bar"></div>
  <div class="searchbox"><span class="ic">🔎</span>
    <input id="q" placeholder="Rechercher une pharmacie, une commune…" autocomplete="off"></div>
  <div class="cnt" id="cnt"></div>
  <div class="grid" id="grid"></div>
</div>
<div class="ov" id="ov"><div class="modal">

  <div class="mhead"><h2 id="m_nm"></h2><div class="en" id="m_en"></div></div>
  <div class="mbody" id="mbody"></div>
</div></div>

const R=DATA.recs, S=DATA.stats, $=id=>document.getElementById(id);
const fmt=n=>(n||0).toLocaleString('fr-FR'), pc=k=>Math.round(S[k]/S.total*100);
const esc=s=>(s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

$('stats').innerHTML=[[fmt(S.total),'officines agréées'],[fmt(S.reg.Flandre),'Flandre'],
 [fmt(S.reg.Wallonie),'Wallonie'],[fmt(S.reg.Bruxelles),'Bruxelles'],
 [pc('ger')+'%','avec gérant'],[pc('tel')+'%','avec téléphone']]
 .map(s=>`<div class="stat"><b>${s[0]}</b><span>${s[1]}</span></div>`).join('');
$('bar').innerHTML=`<i style="width:${S.reg.Flandre/S.total*100}%;background:#4d8dff"></i>`
 +`<i style="width:${S.reg.Wallonie/S.total*100}%;background:#22c98a"></i>`
 +`<i style="width:${S.reg.Bruxelles/S.total*100}%;background:#a78bfa"></i>`;

function toImg(txt){const c=document.createElement('canvas'),k=c.getContext('2d');
 k.font='15px monospace';const w=Math.ceil(k.measureText(txt).width)+6;
 c.width=w*2;c.height=40;const x=c.getContext('2d');x.scale(2,2);
 x.font='15px monospace';x.textBaseline='middle';x.fillStyle='#dfe7f3';x.fillText(txt,1,11);
 const im=new Image();im.src=c.toDataURL();im.style.height='20px';im.draggable=false;return im;}

const norm=s=>(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
function search(){const q=norm($('q').value.trim());
 const cur=!q?R.slice(0,80):R.filter(x=>norm(x.n).includes(q)||norm(x.c).includes(q)||norm(x.e).includes(q));
 $('cnt').textContent=!q?`${fmt(R.length)} officines — tape pour rechercher`:`${fmt(cur.length)} résultat(s)`;
 $('grid').innerHTML=cur.slice(0,120).map(x=>{const i=R.indexOf(x);
   return `<div class="card" data-i="${i}"><div class="nm">${esc(x.n)}</div>
   <div class="meta">${esc(x.c)} · ${esc(x.r)} · ${esc(x.l)}</div>
   <div class="chips"><span class="chip sc">Priorité ${esc(x.sc||'—')}</span>
   ${x.g?'<span class="chip on">gérant ✓</span>':''}${x.t?'<span class="chip on">téléphone ✓</span>':''}${x.m?'<span class="chip on">email ✓</span>':''}</div></div>`;}).join('')
   +(cur.length>120?`<div class="cnt" style="grid-column:1/3">+ ${fmt(cur.length-120)} autres — affine la recherche</div>`:'');}
$('q').addEventListener('input',search);
$('grid').addEventListener('click',e=>{const c=e.target.closest('.card');if(c)openCard(+c.dataset.i);});

const SENS=[['g','Voir le gérant'],['t','Voir le numéro'],['m',"Voir l'email"]];
let CUR=-1;
function showButton(key,label){const el=$('rv_'+key),val=R[CUR][key];el.innerHTML='';
 if(!val){el.innerHTML='<span class="mask">—</span>';return;}
 const b=document.createElement('button');b.className='btn';b.textContent=label;
 b.onclick=()=>{SENS.forEach(([k2,l2])=>{if(k2!==key)showButton(k2,l2);});  // exclusivité : masque les autres
   el.innerHTML='';el.appendChild(toImg(val));};
 el.appendChild(b);}
function openCard(i){CUR=i;const x=R[i];$('m_nm').textContent=x.n;$('m_en').textContent=x.e||'';
 const open_rows=[['N° agrément AFMPS',x.ag],['N° entreprise (BCE)',x.be],['Adresse',x.a],
   ['Région',x.r],['Langue',x.l],['Priorité',x.sc],['Site',x.s||'—']];
